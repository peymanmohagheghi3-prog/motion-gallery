<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Selected Motion Works</title><meta name="description" content="An experimental gallery of motion design and moving images."><style>
:root{--bg:#101010;--fg:#efeee9;--muted:#9c9a93;--line:#353530;--accent:#d8f16a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:26px 5vw;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:-.05em;font-size:20px}.brand span{color:var(--accent)}.counter{font-size:11px;letter-spacing:.15em;color:var(--muted)}main{padding:0 5vw 90px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:65px 0 50px}.hero h1{font-size:clamp(68px,12vw,190px);letter-spacing:-.095em;line-height:.8;margin:0;font-weight:700}.hero h1 em{font-family:Georgia,serif;font-weight:400}.hero p{max-width:210px;font-size:13px;line-height:1.6;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}.filter{border:1px solid #4a4a43;color:var(--muted);background:transparent;padding:10px 15px;border-radius:30px;font-size:12px}.filter.active,.filter:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}.gallery{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:45px 22px}.project{grid-column:span 4;min-width:0}.project.wide{grid-column:span 8}.project.medium{grid-column:span 5}.project.offset{grid-column:span 7;padding-top:95px}.project.hidden{display:none}.thumb{position:relative;display:block;width:100%;padding:0;border:0;overflow:hidden;background:#252525;aspect-ratio:4/3;text-align:left}.wide .thumb{aspect-ratio:16/9}.medium .thumb{aspect-ratio:4/5}.offset .thumb{aspect-ratio:16/10}.art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .7s cubic-bezier(.2,.7,.2,1);overflow:hidden}.thumb:hover .art{transform:scale(1.055)}.art::before,.art::after{content:"";position:absolute}.a1{background:radial-gradient(circle at 70% 35%,#ec795a,#6b2b51 45%,#251b35)}.a1::before{width:43%;aspect-ratio:1;border:45px solid #f6b5a0;border-radius:50%;transform:rotate(-25deg) scaleX(.7);box-shadow:25px 25px 70px #3a1239}.a2{background:linear-gradient(145deg,#c6d8cb,#2c635a)}.a2::before{width:48%;height:70%;background:#e6eee2;transform:rotate(25deg);border-radius:48% 52% 15% 75%}.a3{background:linear-gradient(140deg,#eece6b,#e17a49)}.a3::before{width:58%;aspect-ratio:1;background:#292b2a;border-radius:50%;box-shadow:70px -30px 0 -25px #fff2c7}.a4{background:radial-gradient(circle,#486fbd,#14254b)}.a4::before{width:60%;aspect-ratio:1;border:35px solid #9bb9ed;border-radius:20%;transform:rotate(40deg)}.a5{background:linear-gradient(145deg,#a6a3b5,#e4d7cb)}.a5::before{width:55%;height:60%;border-radius:50%;background:#493d57;filter:blur(2px);transform:skew(-20deg)}.a6{background:linear-gradient(145deg,#2b5444,#9bbd6d)}.a6::before{width:50%;aspect-ratio:1;border-radius:50% 10% 50% 10%;background:#e0e99e;transform:rotate(35deg)}.art b{z-index:1;font-size:clamp(22px,4vw,70px);font-weight:800;letter-spacing:-.07em;color:#fff9;mix-blend-mode:overlay}.play{position:absolute;right:18px;bottom:18px;border:1px solid #ffffff88;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;color:white;background:#0004;backdrop-filter:blur(10px);font-size:16px}.meta{display:flex;justify-content:space-between;gap:10px;padding-top:13px}.meta h2{font-size:17px;font-weight:500;letter-spacing:-.03em;margin:0 0 5px}.meta p,.meta small{color:var(--muted);font-size:11px;margin:0}.meta small{white-space:nowrap}footer{border-top:1px solid var(--line);padding:26px 5vw;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.08em}.modal{position:fixed;inset:0;background:#000e;z-index:10;display:none;align-items:center;justify-content:center;padding:25px}.modal.open{display:flex}.dialog{width:min(1050px,100%)}.modalbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px}.close{background:none;color:white;border:1px solid #777;border-radius:50%;width:40px;height:40px;font-size:24px}.player{width:100%;aspect-ratio:16/9;background:#202020}.player iframe,.player video{width:100%;height:100%;border:0}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#aaa;padding:25px}.notice{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:800px){.hero{display:block;padding:55px 0 38px}.hero p{margin-top:28px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 12px}.project,.project.wide,.project.medium,.project.offset{grid-column:span 1;padding:0}.project.wide{grid-column:span 2}.project .thumb{aspect-ratio:4/5}.project.wide .thumb{aspect-ratio:16/10}.meta{display:block}.meta small{display:block;margin-top:7px}}@media(max-width:480px){.gallery{grid-template-columns:1fr}.project,.project.wide,.project.medium,.project.offset{grid-column:span 1}.project .thumb,.project.wide .thumb{aspect-ratio:4/3}.hero h1{font-size:23vw}header{padding:20px 5vw}footer{gap:20px;flex-wrap:wrap}}

/* Remove demo decorations over uploaded cover images */
.art[style*="background-image"]::before,.art[style*="background-image"]::after{content:none;display:none}

.art::before,.art::after{content:none!important;display:none!important}
</style></head><body><header><a class="brand" href="#">FRAME<span> / </span>WORK</a><div class="counter">13 MOTION PROJECTS · 2026</div></header><main><section class="hero"><h1>Selected<br><em>motion.</em></h1><p>A curated collection of moving images, visual experiments and commercial motion design.</p></section><nav class="filters" aria-label="Filter projects"><button class="filter active" data-filter="all">All works</button><button class="filter" data-filter="2d">2D Motion</button><button class="filter" data-filter="3d">3D & CGI</button><button class="filter" data-filter="commercial">Commercial</button><button class="filter" data-filter="explainer">Explainer</button></nav><section class="gallery" id="gallery" aria-label="Video projects"></section></main><footer><span>SELECTED WORKS / 2026</span><span>DESIGNED TO MOVE.</span></footer><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Video player"><div class="dialog"><div class="modalbar"><strong id="modalTitle">Project</strong><button class="close" id="close" aria-label="Close video">×</button></div><div class="player" id="player"></div><div class="notice" id="notice"></div></div></div><script>
/* Upload videos/project-01.mp4 through videos/project-13.mp4 to GitHub. EDIT PROJECTS HERE. For YouTube use video:{type:'youtube',id:'YOUR_VIDEO_ID'}; for Vimeo use {type:'vimeo',id:'123456789'}; for MP4 use {type:'mp4',url:'https://.../video.mp4'}. Replace demo art with image:'assets/cover.jpg' if desired. */
const projects=[
{title:'GardenOfLove | App Introduction',category:'3d',year:'2026',layout:'wide',art:'a1',word:'FORM',image:'images/cover-01.webp',video:{type:'mp4',url:'videos/project-01.mp4'}},
{title:'Negin Advertising | Logotype Redesign',category:'2d',year:'2026',layout:'medium',art:'a2',word:'FLOW',image:'images/cover-02.webp',video:{type:'mp4',url:'videos/project-02.mp4'}},
{title:'GardenOfLove | Logotype Animation',category:'commercial',year:'2026',layout:'offset',art:'a3',word:'SHIFT',image:'images/cover-03.webp',video:{type:'mp4',url:'videos/project-03.mp4'}},
{title:'Newsha | Product Animation',category:'3d',year:'2026',layout:'wide',art:'a4',word:'WAVE',image:'images/cover-04.webp',video:{type:'mp4',url:'videos/project-04.mp4'}},
{title:'PRP | Skin & Hair Explainer',category:'explainer',year:'2026',layout:'medium',art:'a5',word:'SOFT',image:'images/cover-05.webp',video:{type:'mp4',url:'videos/project-05.mp4'}},
{title:'Parsian Oil & Gas | Rebranding',category:'2d',year:'2026',layout:'offset',art:'a6',word:'GROW',image:'images/cover-06.webp',video:{type:'mp4',url:'videos/project-06.mp4'}},
{title:'HICH | App Introduction',category:'explainer',year:'2026',layout:'',art:'a1',word:'07',image:'images/cover-07.webp',video:{type:'mp4',url:'videos/project-07.mp4'}},
{title:'GardenOfLove | App Features',category:'commercial',year:'2026',layout:'wide',art:'a2',word:'08',image:'images/cover-08.webp',video:{type:'mp4',url:'videos/project-08.mp4'}},
{title:'MCI | ELECOMP Exhibition',category:'3d',year:'2026',layout:'medium',art:'a3',word:'09',image:'images/cover-09.webp',video:{type:'mp4',url:'videos/project-09.mp4'}},
{title:'Avan Shimi | Exhibition Motion',category:'2d',year:'2026',layout:'offset',art:'a4',word:'10',image:'images/cover-10.webp',video:{type:'mp4',url:'videos/project-10.mp4'}},
{title:'Bebak | Commercial Teaser',category:'explainer',year:'2026',layout:'',art:'a5',word:'11',image:'images/cover-11.webp',video:{type:'mp4',url:'videos/project-11.mp4'}},
{title:'realme | Smartphone Launch',category:'commercial',year:'2026',layout:'wide',art:'a6',word:'12',image:'images/cover-12.webp',video:{type:'mp4',url:'videos/project-12.mp4'}},
{title:'World Environment Day | Motion Teaser',category:'3d',year:'2026',layout:'medium',art:'a1',word:'13',image:'images/cover-13.webp',video:{type:'mp4',url:'videos/project-13.mp4'}}
];
const labels={'2d':'2D MOTION','3d':'3D & CGI','commercial':'COMMERCIAL','explainer':'EXPLAINER'};
const gallery=document.getElementById('gallery');const modal=document.getElementById('modal');const player=document.getElementById('player');const notice=document.getElementById('notice');let lastFocus;
function render(filter='all'){gallery.innerHTML='';projects.forEach((p,i)=>{if(filter!=='all'&&p.category!==filter)return;const article=document.createElement('article');article.className='project '+(p.layout||'');const btn=document.createElement('button');btn.className='thumb';btn.setAttribute('aria-label','Play '+p.title);const art=document.createElement('div');art.className='art '+(p.image?'':p.art);if(p.image){art.style.backgroundImage=`url("${p.image.replaceAll('"','%22')}")`;art.style.backgroundSize='cover';art.style.backgroundPosition='center'}else{const word=document.createElement('b');word.textContent=p.word||'';art.append(word)}const play=document.createElement('span');play.className='play';play.textContent='▶';btn.append(art,play);btn.addEventListener('click',()=>openProject(p));const meta=document.createElement('div');meta.className='meta';const info=document.createElement('div');const h=document.createElement('h2');h.textContent=p.title;const tag=document.createElement('p');tag.textContent=labels[p.category]||p.category;info.append(h,tag);const year=document.createElement('small');year.textContent=p.year;meta.append(info,year);article.append(btn,meta);gallery.append(article)})}
function openProject(p){lastFocus=document.activeElement;document.getElementById('modalTitle').textContent=p.title;player.innerHTML='';notice.textContent='';if(!p.video){const d=document.createElement('div');d.className='empty';d.textContent='Demo project. Add a video link in the projects array to enable playback.';player.append(d)}else if(p.video.type==='youtube'||p.video.type==='vimeo'){const frame=document.createElement('iframe');frame.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';frame.src=p.video.type==='youtube'?`https://www.youtube-nocookie.com/embed/${encodeURIComponent(p.video.id)}?autoplay=1&rel=0`:`https://player.vimeo.com/video/${encodeURIComponent(p.video.id)}?autoplay=1`;frame.title=p.title;player.append(frame)}else if(p.video.type==='mp4'){const v=document.createElement('video');v.src=p.video.url;v.controls=true;v.autoplay=true;v.playsInline=true;player.append(v)}modal.classList.add('open');document.body.style.overflow='hidden';document.getElementById('close').focus()}
function closeModal(){modal.classList.remove('open');player.innerHTML='';document.body.style.overflow='';lastFocus?.focus()}
document.getElementById('close').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal()});document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));render();
</script></body></html>
